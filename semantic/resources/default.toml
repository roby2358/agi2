# Default AGI2 Configuration
# Usage: uv run python agi2_train.py resources/default.toml

sources = [
    "resources/training/corpus.txt",
    "resources/training/corpus01.txt",
    "resources/training/corpus20.txt"
]

tokenizer = "tiktoken"  # "tiktoken" (GPT-2 BPE, 50k tokens), "bpe" (corpus-trained), or "char"
bpe_vocab_size = 4096   # target vocab size when tokenizer = "bpe"
model_name = "model"
model_path = "trained/model.pt"

# Training
epochs = 10
batch_size = 12
learning_rate = 3e-4
seq_len_start = 2
seq_len_end = 1024

# Model architecture
model_positions = 1024
model_embd = 768
model_layer = 12
model_head = 12
model_activation = "gelu"
model_dropout = 0.1

# Cosine similarity training
geometric_ratio = 0.7
anchor_ratio = 0.3
sigmoid_scale_start = 3.0
sigmoid_scale_end = 10.0
early_stop_patience = 20
# Start training windows at utterance boundaries (the atomic <|endoftext|>
# token) instead of arbitrary stride offsets. Only takes effect when the
# tokenizer defines that token; otherwise stride starts are used unchanged.
align_sequences = true

# Train every real position against its next token (one signal per token,
# as a causal LM extracts from the same forward pass). false restores the
# original one-signal-per-window last-position formulation as a control.
dense_targets = true

# Training objective: "pairwise" (sigmoid-gap geometric+anchor loss) or
# "infonce" (cross-entropy over cosine logits — cosine training with
# contrastive normalization; the geometric term stays as an auxiliary
# weighted by geometric_ratio, anchor_ratio is unused). nce_temperature
# divides the cosine logits: cosine spans [-1, 1], so 0.07 gives logits
# in roughly [-14, 14]. After infonce training, generation temperature
# near nce_temperature reproduces the trained distribution.
objective = "pairwise"
nce_temperature = 0.07

# Generation anti-repetition. repetition_penalty is subtracted from a
# token's cosine-similarity score once per prior occurrence in the
# generated output (cosine scores span [-1, 1]; suggested 0.3-0.5 at
# temperature 0.3; 0.0 = off). no_repeat_ngram_size hard-bans any token
# that would complete an n-gram already generated (0 = off).
repetition_penalty = 0.0
no_repeat_ngram_size = 0

# Performance
use_compile = false  # torch.compile() for fused kernels
use_amp = false      # Automatic mixed precision (CUDA only)

# Device and resume
device = "cuda"  # "cpu", "cuda", or "auto"
resume = false   # Path to checkpoint, or false

# Generation
max_length = 100
temperature = 0.8
beam_size = 5
model_seed = """
The following is a conversation between a helpful AI assistant and a user. The AI is knowledgeable, creative, and always tries to provide useful and engaging responses.
"""

max_context_length = 1024
