# lil Will RWKV Model Configuration - Tiny Shakespeare
# Same size/data as lilwill.toml, but trained as an RWKV model.
# Usage: uv run python rwkv_train.py resources/lilwill_rwkv.toml

sources = [
    "../samples/shakespeare_dialogue.txt",
    "resources/training/corpus20.txt"
]

tokenizer = "bpe"
bpe_vocab_size = 4096
model_name = "lilwill_rwkv"
model_path = "trained/lilwill_rwkv.pt"

# Training
epochs = 100
batch_size = 32  # halved with the seq_len_end doubling: token budget (batch * seq) unchanged
learning_rate = 1e-4
seq_len_start = 1024  # flat 1024: dense targets put the short-context lessons
seq_len_end = 1024    # inside every full window, so the outer ramp is retired
seq_len_ramp_epochs = 0  # >0 = finish the start->end ramp by that epoch, then hold

# Model architecture (model_head is ignored by RWKV; no attention heads;
# model_positions is also ignored — RWKV is a recurrence with no positional limit)
model_positions = 1024
model_embd = 384
model_layer = 6
model_head = 6
model_activation = "gelu"
model_dropout = 0.1

# Cosine similarity training
geometric_ratio = 0.7
anchor_ratio = 0.3
sigmoid_scale_start = 3.0
sigmoid_scale_end = 10.0
early_stop_patience = 100
align_sequences = true  # windows start at <|endoftext|> utterance boundaries
dense_targets = true    # every position trains against its next token
objective = "infonce"   # CE over cosine logits (see default.toml); "pairwise" = the control
nce_temperature = 0.07

# Performance
use_compile = false
use_amp = false

# Device and resume
device = "cuda"
resume = ""

# Generation
max_length = 300
temperature = 0.07  # matches nce_temperature — the scale the infonce model was trained at
beam_size = 3
repetition_penalty = 0.0  # off — the infonce model doesn't stutter (0.4 was the
                          # pairwise-era crutch; at temp 0.07 it would also be ~6x stronger)
no_repeat_ngram_size = 3  # kept as cheap insurance against loops
model_seed = """
Give ear to him whose words our speech did frame, In joy and grief alike, we speak his name.
"""

max_context_length = 1024
