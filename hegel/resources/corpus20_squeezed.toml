# corpus20 with the squeezed build: short random token vectors in the slots
# and a narrow logit code. Compare with corpus20.toml, the exact wide build.
# Usage (from hegel/): uv run python hegel_compile.py resources/corpus20_squeezed.toml

corpus = "../samples/corpus20.txt"

vocab_size = 512
max_context = 3
floor = 1e-4
smoothing = "witten_bell"
prune_threshold = 0.5

holdout_fraction = 0.1
holdout_block = 1000
holdout_seed = 0
holdout_seeds = 5

slot_dim = 32            # token vector width; 0 = one-hot
logit_dim = 128          # logit code width; 0 = full vocabulary, exact
match_threshold = 0.7    # how near a full match a context neuron must be
low_weight = 0.003       # what a zero-probability token counts for in the factoring
decoder_rounds = 4       # alternating least-squares rounds; 0 = random decoder
code_seed = 0

seed = 0
sample_count = 4
sample_tokens = 80
temperature = 0.8        # for samples and generation; 1 = sample as is
